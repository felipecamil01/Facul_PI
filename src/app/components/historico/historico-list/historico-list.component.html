<div class="card">
  <div class="card-body">
    <div class="card-header">
      <h2 class="card-title text-center mb-4">Histórico de Alterações</h2>
    </div>

    <div class="row mb-4 p-3 border rounded">
      <div class="col-md-5">
        <label for="tipoEntidade" class="form-label">Tipo de Entidade</label>
        <select id="tipoEntidade" class="form-select" [(ngModel)]="tipoPesquisa">
          <option value="processo">Processo</option>
          <option value="despesa">Despesa</option>
          <option value="cliente">Cliente</option>
          <option value="contato">Contato</option>
        </select>
      </div>
      <div class="col-md-5">
        <label for="idEntidade" class="form-label">ID da Entidade</label>
        <input type="number" id="idEntidade" class="form-control" placeholder="Digite o ID" [(ngModel)]="idPesquisa">
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" (click)="pesquisarHistorico()" [disabled]="!idPesquisa">
          <i class="fas fa-search"></i> Pesquisar
        </button>
      </div>
    </div>
    <table class="table table-bordered table-striped">
      </table>
  </div>
</div>
