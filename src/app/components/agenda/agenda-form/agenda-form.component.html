<div class="card dark-theme">
  <button class="close-button" (click)="closeModal()">×</button>
  <div class="card-header mb-4">
    <h2 class="card-title text-center">
      {{ modoEdicao ? 'Editar Sessão' : 'Agendar Nova Sessão' }}
    </h2>
    <div class="text-center text-muted" *ngIf="selectedDate">
      Data selecionada: {{ selectedDate | date:'dd/MM/yyyy' }}
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="titulo">Título</label>
      <input id="titulo" type="text" formControlName="titulo" placeholder="Título/descrição do evento" required />
    </div>

    <div class="form-group">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" formControlName="descricao" rows="3" placeholder="Descreva o evento..."></textarea>
    </div>

    <div class="grid">
      <div>
        <label for="tipo">Tipo</label>
        <select id="tipo" formControlName="tipo">
          <option value="Pagamentos">Pagamentos</option>
          <option value="Processo">Processo</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
      <div>
        <label for="horario">Horário</label>
        <input id="horario" type="time" formControlName="horario" required />
      </div>
    </div>

    <div class="form-group">
      <label for="processo">Vincular Processo (opcional)</label>
      <select id="processo" formControlName="processoId">
        <option [ngValue]="null">-- Nenhum --</option>
        <option *ngFor="let p of processos" [ngValue]="p.id">
          {{ p.numeroProcesso || ('Processo #' + p.id) }} - {{ p.cliente?.nome || '' }}
        </option>
      </select>
    </div>

    <div class="actions">
      <button type="button" class="btn-cancel" (click)="closeModal()">Cancelar</button>
      <button type="submit" class="btn-confirm" [disabled]="!form.valid">
        {{ modoEdicao ? 'Salvar' : 'Criar' }}
      </button>
    </div>
  </form>
</div>
